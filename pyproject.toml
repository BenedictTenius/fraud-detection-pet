[project]
name = "fraud-detection"
version = "0.1.0"
description = "Production-style fraud scoring with tree models, Triton and drift monitoring"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "catboost>=1.2.10",
    "fastapi>=0.141.1",
    "lightgbm>=4.7.0",
    "matplotlib>=3.10.0",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "prometheus-client>=0.23.1",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.7.2",
    "tritonclient[grpc]>=2.69.0,<2.70.0",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "httpx2>=2.0.0,<3",
    "mypy>=1.17.0,<2",
    "pandas-stubs>=2.3.0,<3",
    "pytest>=8.4.0,<10",
    "pytest-cov>=6.2.0,<8",
    "ruff>=0.12.0,<1",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.10"
explicit_package_bases = true
mypy_path = ["."]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-config --strict-markers"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    '\.\.\.',
]
