global:
  scrape_interval: 15s
  evaluation_interval: 1m

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: fraud-api
    metrics_path: /metrics/
    static_configs:
      - targets: [api:8000]

  - job_name: triton
    metrics_path: /metrics
    static_configs:
      - targets: [triton:8002]
